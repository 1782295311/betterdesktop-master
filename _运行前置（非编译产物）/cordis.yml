# cordis.yml — 声明式插件树（ADR-002 loader 落地）
# 迁移期保序：条目顺序与原 Bootstrap.cs 硬编码 context.Plugin() 顺序完全一致。
# 时序敏感依赖由各插件 [Inject] 声明 + 内核 Pending/restart 机制保障，
# 此处顺序仅为迁移期行为等价，后续可按需调整（Inject 完整时顺序不敏感）。
#
# 字段：id（稳定标识，诊断用）/ name（宿主 Factories 字典键）/ enabled（缺省 true）

plugins:
  # 1. 电源管理（最先加载，立刻降优先级 + 放行系统休眠）
  - id: power-management
    name: power-management

  # 2. 基础服务：定时器
  - id: timer
    name: timer

  # 3. 基础服务：亚克力/模糊
  - id: vibrancy
    name: vibrancy

  # 3.5 活动仲裁服务（Provide IActivityService：灵动岛等表面的统一消息入口 + 1 s TTL 心跳 + 变更广播）
  #     必须早于所有活动来源（convert/status/clipboard-history）与表面（island）
  - id: activity
    name: activity

  # 4. 系统状态采集（CPU/内存/电池/音量/网络等），必须早于 UI 消费插件
  - id: status
    name: status

  # 5. 应用数据来源（Provide IAppSourceService/IAppIconService），必须早于 Dock
  - id: app-source
    name: app-source

  # 6. 运行中窗口/应用追踪（Provide IWindowTrackerService），必须早于 Dock
  - id: window-tracker
    name: window-tracker

  # 7. 通用固定/收藏服务（Provide IPinningService），必须早于 Dock
  - id: pinning
    name: pinning

  # 8. 搜索服务（开始菜单搜索），依赖 AppSource + WindowTracker
  - id: search
    name: search

  # 9. 最近项服务（最近程序/文档/跳转列表）
  - id: recent
    name: recent

  # 10. Dock 插件（窗口层，依赖 AppSource/WindowTracker/Pinning）
  - id: dock
    name: dock

  # 11. 设置中心（Provide ISettingsWindowService，注册设置分区）
  - id: settings
    name: settings

  # 11.5 热键注册表（Provide IHotkeyRegistryService：HWND_MESSAGE 中心窗口 + 单钩子查表，
  #      热键侧板/设置中心/截图热键的唯一真相源；依赖 ISettingsService，Bootstrap 已提前 Provide）
  - id: hotkeys
    name: hotkeys

  # 11.6 热键侧板（常驻透明窗，只读实时表 + 右 Alt 门控可操作态；声明迁移既有热键进注册表，
  #      依赖 hotkeys 插件，缺失时降级不创建）
  - id: hotkeys-panel
    name: hotkeys-panel

  # 12. 新装应用通知（右下角弹窗，依赖 IAppearanceService）
  - id: notification
    name: notification

  # 13. 任务栏外观控制（透明/模糊/亚克力，依赖 ISettingsSectionRegistry）
  - id: taskbar-appearance
    name: taskbar-appearance

  # 14. 开始菜单（依赖 Settings/AppSource/Vibrancy/Appearance）
  - id: start-menu
    name: start-menu

  # 15. 统一右键菜单（五区块骨架，必须先于 desktop）
  - id: context-menu
    name: context-menu

  # 16. 文档转换（转换矩阵 + 引擎注册表 + 压缩/解压）
  - id: convert
    name: convert

  # 17. 自绘桌面 —— 【2026-09-17 M2 迁出宿主】
  #     用户定调："菜单栏和 Dock 需要主程序，自绘桌面和连带的自绘右键菜单**不需要**主程序"，
  #     且托盘要能做到"按需启动功能、省内存"。因此桌面层（全屏窗口 + 图标网格 + 自绘右键菜单
  #     + 原生模式双击隐藏图标钩子 + 桌面控制菜单）整体搬到独立进程**常驻**：
  #       packages/shell/shell-desktop-control/（BetterDesktop.DesktopControl.exe，清单 desktop.yml）
  #     宿主启动时只"确保它在跑"（Bootstrap.EnsureDesktopServiceRunning），不接管、不随宿主退出。
  #     ⚠️ 此处不要再re-add：两进程同时拥有桌面层 = 两层图标互相打架（硬红线）。

  # 18. 日历（农历/节假日/节气/天气，Provide ICalendarService，必须早于 menu-bar）
  - id: calendar
    name: calendar

  # 19. 顶部菜单栏（右区状态条 + 各面板，依赖 status/vibrancy/appearance）
  - id: menu-bar
    name: menu-bar

  # 20. 快速笔记（扩展中心开关驱动的常驻浮窗）
  - id: quick-note
    name: quick-note
  - id: clipboard-history
    name: clipboard-history

  # 21. 灵动岛（活动呈现面：菜单栏中置的液体胶囊 + 弹簧动效 + 脉冲进度）
  #     必须排在最后：三个来源分别是 status(媒体) / convert(事件) / clipboard-history(剪贴板)，
  #     排在它们之后即可用 context.Get 直接取到服务，无需 Pending 等待。
  - id: island
    name: island

  # 22. 统一翻译能力（Provide ITranslateService：本机 Ollama / OpenAI 兼容双入口，
  #     **不内置模型**、不建进程）。无必需依赖：取 ISettingsService 为可选依赖 + 只读设置文件兜底，
  #     因此排在最后即可（消费方按调用时 context.Get 取用，与加载顺序无关）。
  - id: translate
    name: translate

  # 23. 实时屏幕翻译（前台窗口外文行 → 译文贴在原文上方；覆盖层全穿透、不抢焦点）。
  #     依赖 translate（必需，[Inject] 声明）+ window-tracker/hotkeys（可选，缺失即降级）。
  #     默认**关**：热键 Ctrl+Alt+T 三态（关 → 开 → 暂停），设置键 translate.overlay.enabled。
  - id: live-translate
    name: live-translate
